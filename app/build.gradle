plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 36
    namespace "com.bakuchat.id"
    defaultConfig {
        applicationId "com.bakuchat.id"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0.0"

        // Nama aplikasi (dipakai AndroidManifest.xml lewat @string/appName)
        resValue "string", "appName", "Baku Chat"

        // Nama di Android Launcher (dipakai lewat @string/launcherName)
        resValue "string", "launcherName", "Baku Chat"

        // Dipakai oleh FileProvider di AndroidManifest.xml
        resValue "string", "providerAuthority", applicationId + '.fileprovider'
    }
    buildTypes {
        release {
            // Dimatikan dulu -- ProGuard/R8 bisa merusak WebView JS interface
            // kalau belum ada proguard-rules khusus. Aman dinyalakan lagi
            // nanti kalau kamu sudah setup rules yang sesuai.
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Dibutuhkan oleh MainActivity.java (AppCompatActivity)
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Dependency androidbrowserhelper (TWA) DIHAPUS -- tidak dipakai lagi
    // karena sudah pindah ke WebView native.
}
